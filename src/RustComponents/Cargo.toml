[package]
name = "rust_components"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
ureq = "2.9"
image = { version = "0.24", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "tga"] }
lazy_static = "1.4.0"

[profile.release]
# Match C++ Release intent: optimize for speed while reducing binary size.
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
